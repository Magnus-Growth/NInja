name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -R assets dist/assets
          test "$(find dist/assets/wins -maxdepth 1 -name 'win-*.webp' | wc -l)" -eq 8
          grep -q 'id="competition-wins"' dist/index.html
          grep -q 'id="join-competition"' dist/index.html
          grep -q 'class="path-bottom"' dist/index.html
          for n in $(seq 1 8); do
            f="dist/assets/wins/win-$(printf '%02d' "$n").webp"
            test -s "$f" || { echo "Missing image: $f"; exit 1; }
          done
          touch dist/.nojekyll
      - name: Validate both forms, privacy-safe proof gallery and inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html = Path("dist/index.html").read_text(encoding="utf-8")
          class CheckForms(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.ids = set()
              def handle_starttag(self,tag,attrs):
                  a = dict(attrs)
                  if a.get('id'): self.ids.add(a['id'])
                  if tag == 'form': self.forms.append(a.get('id'))
          p=CheckForms()
          p.feed(html)
          assert p.forms == ['applicationForm','competitionForm'],p.forms
          for ident in ('competition-form','join-competition','competeJoinLink','cpFullName','cpPhone','cpTelegram','cpAccountStatus','cpShare','cpConsent','cpSendButton','cpCopyButton','cpFormStatus','pathJob','pathCompete'):
              assert ident in p.ids,ident
          for block in ('class="compete-notice"','class="rules"','class="proof-disclaimer"','class="tiny-note"'):
              assert block not in html,block
          assert html.count('class="proof-card"') == 8
          assert 'https://t.me/lotmanager' in html
          assert html.count('data-clarity-mask="true"') == 2
          for ident in ('trackingConsent','trackingAccept','trackingDecline','trackingSettings'):
              assert ident in p.ids,ident
          assert 'src="assets/analytics.js"' in html
          analytics=Path("dist/assets/analytics.js").read_text(encoding="utf-8")
          for marker in ('G-00J1364DR1','z6gz4nvssg',"'_form_start'","'_telegram_draft_click'","'scroll_'",'proof_image_open','analytics_storage','consentv2'):
              assert marker in analytics,marker
          assert 'dataLayer.push(arguments)' in analytics
          assert not any(x in analytics for x in ('formData.fullName','formData.phone','formData.telegram','encodeURIComponent(msg)'))

          script = re.search(r'<script>(.*?)</script>',html,re.S)
          assert script, 'Missing inline JavaScript'
          Path('/tmp/ninja-inline.js').write_text(script.group(1),encoding='utf-8')
          print('HTML form and gallery checks passed')
          PY
          node --check /tmp/ninja-inline.js
          node --check dist/assets/analytics.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
